# Copy to provision/clients/your-client.conf and edit.
#
# First-time flow (from repo root):
#   ./bin/remote server your-client      # once per VPS
#   ./bin/remote github-key your-client  # private GitHub repos only
#   ./bin/remote site your-client

IP=172.105.11.222
TIER=flat-file
DOMAIN=client.com
# Use SSH for private repos (after github-key step above).
REPO=git@github.com:craftjd/client.com.git

# TLS — Certbot requests certs for both DOMAIN and www.DOMAIN (@ and www).
# Requires DNS A records for @ and www before provisioning.
SSL=true
CERT_EMAIL=you@example.com

# App tier only (optional)
# DB_NAME=client_db
# DB_USER=client_user
# DB_PASS=strong-password

# Run ./bin/deploy at end of provision/site (usually wait until .env mail is set)
# DEPLOY=false

# Private repo details: docs/MAINTENANCE.md → Private GitHub repos
