# Copy to provision/clients/your-client.conf and edit.
#
# First-time flow (from repo root):
#   ./bin/remote server your-client      # once per VPS
#   ./bin/remote github-key your-client  # private GitHub repos only
#   ./bin/remote site your-client
#   ./bin/remote env your-client push    # sync site/mail settings into .env

# --- Provisioning ---
IP=172.105.11.222
TIER=flat-file
DOMAIN=client.com
# Use SSH for private repos (after github-key step above).
REPO=git@github.com:craftjd/client.com.git

# TLS — Certbot requests certs for both DOMAIN and www.DOMAIN (@ and www).
# Requires DNS A records for @ and www before provisioning.
SSL=true
CERT_EMAIL=you@example.com

# App tier only (optional — or use DB_DATABASE / DB_USERNAME / DB_PASSWORD)
# DB_NAME=client_db
# DB_USER=client_user
# DB_PASS=strong-password

# Run ./bin/deploy at end of provision/site (usually wait until env push first)
# DEPLOY=false

# --- Site (.env) — synced via ./bin/remote env CLIENT push ---
APP_NAME="Client Site Name"
SITE_DESCRIPTION=
CONTACT_EMAIL=owner@clientdomain.com
# GA_MEASUREMENT_ID=G-XXXXXXXX

# --- Mail (.env) ---
MAIL_MAILER=smtp
MAIL_HOST=smtp.example.com
MAIL_PORT=587
MAIL_USERNAME=
MAIL_PASSWORD=
MAIL_SCHEME=tls
# MAIL_FROM_ADDRESS defaults to noreply@${DOMAIN}

# --- Optional (.env) — only pushed when set ---
# MONITOR_KEY=           # copy from server after provision/site (for hub polling)
# DEPLOY_BRANCH=main
# CHECK_URL=

# Private repo details: docs/MAINTENANCE.md → Private GitHub repos
