# Copy to bin/provision/clients/CLIENT.conf and edit.
# CLIENT = short slug (e.g. joes), not the domain. DOMAIN = public hostname.
#
# All operations go through `task <namespace>:<action>` (from the project root).
# No need to SSH into the server for any of these steps.
#
# ── First-time flow (fresh VPS) ──────────────────────────────────────────────
#
#   1. CONFIRM=true task provision:server    # one-time VPS setup (packages, user, firewall)
#   2. task provision:github-key             # GitHub deploy key (private repos only)
#   3. CONFIRM=true task provision:site      # clone repo, nginx, certbot, .env from below
#   4. task provision:env                    # re-sync .env after editing this file
#   5. task deploy                           # first atomic deploy (zero-downtime)
#
# ── Second site, same VPS ────────────────────────────────────────────────────
#   Create a new CLIENT.conf with the same IP, new DOMAIN + REPO.
#   Skip the provision:server step.
#
# ── Domain change (e.g. staging.client.com → staging2.client.com) ────────────
#
#   1. Edit this file: set DOMAIN=staging2.client.com
#   2. Update DNS (A record for new domain → server IP)
#   3. CONFIRM=true task provision:site      # creates new deploy dir, nginx config, cert
#   4. task site:migrate-domain OLD_DOMAIN=staging.client.com   # copes DB, storage, APP_KEY
#   5. task deploy                           # deploy latest code to new directory
#
# ── Confirmations ────────────────────────────────────────────────────────────
#   provision:server and provision:site (update mode) require interactive
#   confirmation. Bypass with CONFIRM=true on first run or when you're certain.
#
# See docs/MAINTENANCE.md for the full new-client checklist.

# ─────────────────────────────────────────────────────────────────────────────
# PROVISIONING
# ─────────────────────────────────────────────────────────────────────────────

IP=172.105.11.222
TIER=flat-file
DOMAIN=client.com

# Use SSH for private repos (after github-key step above).
# The provision script rewrites this to git@github.com-DOMAIN:… during clone
# so ~/.ssh/config selects the per-domain deploy key automatically.
REPO=git@github.com:craftjd/client.com.git

# TLS — Certbot requests certs for both DOMAIN and www.DOMAIN (@ and www).
# Requires DNS A records for @ and www before provisioning.
SSL=true
CERT_EMAIL=you@example.com

# App tier only (optional — or set all of DB_NAME / DB_USER / DB_PASS)
# DB_NAME=client_db
# DB_USER=client_user
# DB_PASS=strong-password

# Run deploy immediately after provision/site — usually wait until env push first
# DEPLOY=false

# ─────────────────────────────────────────────────────────────────────────────
# SITE (.env) — applied during provision/site; re-sync via task provision:env
# ─────────────────────────────────────────────────────────────────────────────

APP_NAME="Client Site Name"
SITE_DESCRIPTION=
CONTACT_EMAIL=owner@clientdomain.com
# GA_MEASUREMENT_ID=G-XXXXXXXX

# ─────────────────────────────────────────────────────────────────────────────
# MAIL (.env)
# ─────────────────────────────────────────────────────────────────────────────
# Default log until go-live — contact form writes to storage/logs/laravel.log.
# Switch to smtp and fill MAIL_HOST (etc.) before the site is live.
MAIL_MAILER=log
# MAIL_MAILER=smtp
# MAIL_HOST=smtp.example.com
# MAIL_PORT=587
# MAIL_USERNAME=
# MAIL_PASSWORD=
# MAIL_SCHEME=tls
# MAIL_FROM_ADDRESS defaults to noreply@${DOMAIN}

# ─────────────────────────────────────────────────────────────────────────────
# JOE'S CAFE (.env) — webhook back to the main craftjd site
# ─────────────────────────────────────────────────────────────────────────────
# MAIN_SITE_DOMAIN=craftjd.com
# MAIN_SITE_WEBHOOK_URL=https://craftjd.com/api/joes/requests
# MAIN_SITE_SSL=true
# JOES_WEBHOOK_SECRET=               # must match main site — only pushed when set
# JOES_LOCAL_DEPLOY_BYPASS_GIT=false

# ─────────────────────────────────────────────────────────────────────────────
# MAINTENANCE MODE
# ─────────────────────────────────────────────────────────────────────────────
#   task site:down   # put site in maintenance mode
#   task site:up     # bring it back

# ─────────────────────────────────────────────────────────────────────────────
# OPTIONAL (.env) — only pushed when set
# ─────────────────────────────────────────────────────────────────────────────
# MONITOR_KEY=      # copy from server after provision/site (for hub polling)
# DEPLOY_BRANCH=main
# CHECK_URL=

# ─────────────────────────────────────────────────────────────────────────────
# BACKUP RETENTION
# ─────────────────────────────────────────────────────────────────────────────
# Backups are created on the server. Commands (from local machine):
#   task backup:create     # create a backup now
#   task backup:list       # list available backups
#   task backup:restore    # restore from a backup (omit BACKUP for picker)

# Simple mode (default): keep backups newer than N days
BACKUP_KEEP_DAYS=14

# GFS mode (uncomment all three to override; keeps N daily, M weekly, P monthly):
# BACKUP_KEEP_DAILY=7
# BACKUP_KEEP_WEEKLY=4
# BACKUP_KEEP_MONTHLY=12

# Even more reserved GFS (e.g. for low-traffic or archival sites):
# Uncomment to keep 1 backup per day for 14 days, then 1 per week for 8 weeks,
# then 1 per month for 12 months.
# BACKUP_KEEP_DAILY=14
# BACKUP_KEEP_WEEKLY=8
# BACKUP_KEEP_MONTHLY=12

# See docs/MAINTENANCE.md — New client checklist
