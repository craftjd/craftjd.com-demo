# Copy to provision/clients/CLIENT.conf and edit.
# CLIENT = short slug (e.g. craftjd), not the domain. DOMAIN = public hostname.
#
# First-time flow (from repo root):
#   ./bin/remote server CLIENT       # once per VPS
#   ./bin/remote github-key CLIENT # private GitHub repos only (per DOMAIN)
#   ./bin/remote site CLIENT       # clones repo, writes .env from config below
#   ./bin/remote env CLIENT push     # re-sync .env after editing this file
#
# Second site, same VPS: new CLIENT.conf, same IP, new DOMAIN + REPO — skip server step.
# Each DOMAIN gets its own deploy key (~/.ssh/github_deploy_DOMAIN)
# so multiple private repos on the same server each have a unique key.
# See docs/MAINTENANCE.md → Client naming, Deploy keys

# --- Provisioning ---
IP=172.105.11.222
TIER=flat-file
DOMAIN=client.com
# Use SSH for private repos (after github-key step above).
# The provision script rewrites this to git@github.com-DOMAIN:… during clone
# so ~/.ssh/config selects the per-domain deploy key automatically.
REPO=git@github.com:craftjd/client.com.git

# TLS — Certbot requests certs for both DOMAIN and www.DOMAIN (@ and www).
# Requires DNS A records for @ and www before provisioning.
SSL=true
CERT_EMAIL=you@example.com

# App tier only (optional — or use DB_DATABASE / DB_USERNAME / DB_PASSWORD)
# DB_NAME=client_db
# DB_USER=client_user
# DB_PASS=strong-password

# Run ./bin/deploy at end of provision/site (usually wait until env push first)
# DEPLOY=false

# --- Site (.env) — applied during provision/site; re-sync via env push ---
APP_NAME="Client Site Name"
SITE_DESCRIPTION=
CONTACT_EMAIL=owner@clientdomain.com
# GA_MEASUREMENT_ID=G-XXXXXXXX

# --- Mail (.env) ---
# Default log until go-live — contact form writes to storage/logs/laravel.log.
# Switch to smtp and fill MAIL_HOST (etc.) before the site is live.
MAIL_MAILER=log
# MAIL_MAILER=smtp
# MAIL_HOST=smtp.example.com
# MAIL_PORT=587
# MAIL_USERNAME=
# MAIL_PASSWORD=
# MAIL_SCHEME=tls
# MAIL_FROM_ADDRESS defaults to noreply@${DOMAIN}

# --- Joe's Cafe (.env) — main-site webhook; synced when set ---
# MAIN_SITE_DOMAIN=craftjd.com
# MAIN_SITE_WEBHOOK_URL=https://craftjd.com/api/joes/requests
# MAIN_SITE_SSL=true
# JOES_WEBHOOK_SECRET=         # must match main site — only pushed when set
# JOES_LOCAL_DEPLOY_BYPASS_GIT=false

# --- Optional (.env) — only pushed when set ---
# MONITOR_KEY=           # copy from server after provision/site (for hub polling)
# DEPLOY_BRANCH=main
# CHECK_URL=

# --- Backup retention (run after each `task backup:create`) ---
# Simple mode (default): keep backups newer than N days
BACKUP_KEEP_DAYS=14
#
# GFS mode (uncomment to override; keeps N daily, M weekly, P monthly):
# BACKUP_KEEP_DAILY=7
# BACKUP_KEEP_WEEKLY=4
# BACKUP_KEEP_MONTHLY=12

# See docs/MAINTENANCE.md — New client checklist
